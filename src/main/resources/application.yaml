spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            required: ${MAIL_SMTP_STARTTLS:false}
          ssl:
            enable: ${MAIL_SMTP_SSL:false}
            trust: ${MAIL_HOST:localhost}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${APP_PORT:8081}

app:
  monitoring:
    scheduler:
      enabled: true
      fixed-delay-ms: 60000
  security:
    jwt:
      secret: ${JWT_SECRET:node-health-tracker-development-secret-key-must-be-long-enough}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  mail:
    from: ${MAIL_FROM:node-health-tracker@example.com}
  password-reset:
    log-token: ${PASSWORD_RESET_LOG_TOKEN:false}

  telegram:
    api-url: ${TELEGRAM_API_URL:https://api.telegram.org}
    bot-token: ${TELEGRAM_BOT_TOKEN:}

  vk:
    api-url: ${VK_API_URL:https://api.vk.com/method}
    access-token: ${VK_ACCESS_TOKEN:}
    api-version: ${VK_API_VERSION:5.199}
    group-id: ${VK_GROUP_ID:}
    confirmation-code: ${VK_CONFIRMATION_CODE:}
    callback-secret: ${VK_CALLBACK_SECRET:}
