spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml

server:
  port: ${APP_PORT:8081}

app:
  monitoring:
    scheduler:
      enabled: true
      fixed-delay-ms: 60000
  security:
    jwt:
      secret: ${JWT_SECRET:node-health-tracker-development-secret-key-must-be-long-enough}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}